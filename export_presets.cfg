html/head_include="<style>\n#tob-rotate{display:none;position:fixed;inset:0;z-index:9999;background:#0d0d14;color:#f0e6c8;font-family:sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;font-size:20px;line-height:1.8}\n#tob-rotate .ico{font-size:56px}\n@media (orientation:portrait) and (pointer:coarse){#tob-rotate{display:flex}}\nhtml,body,canvas{touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}\n</style>\n<script>\ndocument.addEventListener('DOMContentLoaded',function(){\nvar d=document.createElement('div');d.id='tob-rotate';\nd.innerHTML='<div class=\"ico\">&#x1F4F1;&#x21BB;</div><div>スマホを横向きにしてください</div><div style=\"font-size:14px;opacity:.7\">画面をタップすると全画面で遊べます</div>';\ndocument.body.appendChild(d);\nvar tried=false;\nfunction full(){if(tried)return;tried=true;var el=document.documentElement;\ntry{var p=(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);\nif(p&&p.then){p.then(function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}).catch(function(){});}}catch(e){}}\nif(window.matchMedia('(pointer:coarse)').matches){document.addEventListener('touchend',full,{once:false,passive:true});}\n});\n</script>"
